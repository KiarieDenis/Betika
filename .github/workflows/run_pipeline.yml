name: Run Betika Pipeline

# Trigger on pushes to main (or master) and on a daily schedule
on:
  push:
    branches: ["master", "main"]
  schedule:
    - cron: "0 8 * * *"   # Run daily at 02:00 UT (adjust as needed)

jobs:
  scrape-and-store:
    runs-on: ubuntu-latest
    env:
      # Pull Supabase credentials from repository secrets
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the pipeline
        run: python run_pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Upload logs as artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            data/*.csv
            scrapers/*.json
            *.log
